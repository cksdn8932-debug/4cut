<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>인생네컷 Studio</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:#111;display:flex;justify-content:center;font-family:Arial,'Malgun Gothic',sans-serif;color:#161616}.app{width:100%;max-width:430px;min-height:100vh;background:#f7f5f2;overflow:hidden}.screen{display:none;min-height:100vh}.screen.active{display:block;animation:up .35s ease}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.header{padding:44px 24px 18px;background:linear-gradient(180deg,#fff 0,#f7f5f2 100%)}.brand{display:flex;align-items:end;gap:8px}.logo{font-family:Georgia,serif;font-size:30px;font-style:italic;font-weight:bold;letter-spacing:-1px}.badge{background:#151515;color:#fff;border-radius:20px;padding:4px 9px;font-size:9px;letter-spacing:1.5px;font-weight:bold;margin-bottom:3px}.desc{font-size:12px;color:#888;margin-top:8px}.steps{padding:0 24px 20px;display:flex;align-items:flex-start}.step{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:32px}.circle{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e6e2dc;color:#aaa;font-size:12px;font-weight:bold}.circle.on,.circle.done{background:#151515;color:#fff}.st{font-size:9px;color:#aaa;white-space:nowrap}.st.on{color:#151515;font-weight:bold}.line{height:1px;background:#ddd8d1;flex:1;margin:14px 4px 0}.section{padding:8px 24px 12px;display:flex;justify-content:space-between;align-items:center}.label{font-size:10px;font-weight:bold;letter-spacing:2px;color:#888}.tag{font-size:10px;padding:4px 10px;border-radius:20px;background:#fee2e2;color:#d33}.tag.green{background:#dff5e8;color:#16845c}
.themes{padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.theme{border:2px solid transparent;border-radius:17px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.05);transition:.2s}.theme.selected{border-color:#111}.visual{height:115px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:5px;position:relative}.visual i{border-radius:6px;opacity:.9}.info{padding:10px}.name{font-size:12px;font-weight:bold}.sub{font-size:10px;color:#888;margin-top:3px}.check{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:#111;color:#fff;display:none;place-items:center;font-size:11px}.selected .check{display:grid}.moon{background:linear-gradient(145deg,#0d1b3e,#1b3769)}.moon i:nth-child(1){background:#274c86}.moon i:nth-child(2){background:#1a3260}.moon i:nth-child(3){background:#365d99}.moon i:nth-child(4){background:#14274c}.gold{background:linear-gradient(145deg,#f6e6bd,#d9b66c)}.gold i{background:#c99d4f}.maple{background:linear-gradient(145deg,#3d1808,#783114)}.maple i{background:#99421d}.hanbok{background:linear-gradient(145deg,#e8f0ec,#b9d4c2)}.hanbok i{background:#a7c7b1}.more{display:flex;gap:8px;overflow:auto;padding:12px 24px 3px}.pill{white-space:nowrap;background:#fff;border:1px solid #ddd8d1;border-radius:24px;padding:9px 13px;font-size:11px;cursor:pointer}.pill.selected{background:#111;color:#fff;border-color:#111}
.slots{padding:0 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{aspect-ratio:3/4;border:1.5px dashed #cfc9c0;border-radius:11px;background:#edeae5;overflow:hidden;display:grid;place-items:center;cursor:pointer;position:relative}.slot span{font-size:22px;color:#bbb}.slot small{position:absolute;bottom:8px;color:#bbb}.slot img{width:100%;height:100%;object-fit:cover}.done{position:absolute;right:4px;top:4px;background:#111;color:#fff;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.preview{margin:0 24px;border-radius:22px;background:#111;padding:24px 18px;display:flex;justify-content:center;align-items:center;gap:18px;min-height:230px}.strip{width:108px;padding:7px 7px 14px;border-radius:10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.strip.grid{display:grid;grid-template-columns:1fr 1fr}.ps{aspect-ratio:1;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}.ps img{width:100%;height:100%;object-fit:cover}.foot{font:italic 9px Georgia,serif;text-align:center;margin-top:3px}.brand-foot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 0 3px;font-family:'Malgun Gothic',Arial,sans-serif;font-style:normal;line-height:1}.brand-foot .brand-main{font-size:11px;font-weight:500;letter-spacing:.5px}.brand-foot .brand-sub{font-size:8px;letter-spacing:1px}.brand-foot .brand-stars{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82%;display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:9px;line-height:1;pointer-events:none}.brand-foot .brand-stars span{display:block}.strip.grid .foot{grid-column:1/-1}.layouts{display:flex;flex-direction:column;gap:7px}.layout{width:39px;height:39px;border-radius:9px;background:#252525;border:1px solid #555;color:#fff;cursor:pointer;font-size:15px}.layout.active{background:#555}.btnarea{padding:16px 24px 34px}.primary{width:100%;border:0;border-radius:16px;padding:16px;background:#111;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.primary:disabled{background:#ccc7bf}.savehero{text-align:center;padding:48px 24px 12px}.savehero b{display:block;font-size:24px;margin:8px}.savehero p{font-size:13px;color:#888}.resultbox{margin:20px 24px;background:#111;border-radius:22px;padding:28px;display:flex;justify-content:center}.resultstrip{width:210px;max-width:100%;padding:10px 10px 18px;border-radius:12px;display:flex;flex-direction:column;gap:6px}.resultstrip.grid{display:grid;grid-template-columns:1fr 1fr}.rs{aspect-ratio:1;background:rgba(255,255,255,.15);overflow:hidden;border-radius:5px}.rs img{width:100%;height:100%;object-fit:cover}.resultstrip .foot{font-size:11px}.resultstrip .brand-foot{gap:5px;padding:8px 0 5px}.resultstrip .brand-foot .brand-main{font-size:15px}.resultstrip .brand-foot .brand-sub{font-size:10px}.resultstrip .brand-foot .brand-stars{width:78%;font-size:12px}.resultstrip.grid .foot{grid-column:1/-1}.actions{padding:0 24px 25px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{background:#fff;border:1px solid #e7e2dc;border-radius:15px;padding:16px;text-align:center;font-size:12px;color:#555}.savebtn{margin:0 24px 10px;width:calc(100% - 48px);border:0;border-radius:16px;padding:16px;background:#111;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.savebtn:active{transform:scale(.99);opacity:.9}
</style></head><body><div class="app"><div class="screen active" id="main"><header class="header"><div class="brand"><div class="logo">인생네컷</div><div class="badge">STUDIO</div></div><div class="desc">나만의 네컷 프레임을 골라보세요</div></header><div class="steps"><div class="step"><div class="circle on" id="c1">1</div><div class="st on">테마</div></div><div class="line"></div><div class="step"><div class="circle" id="c2">2</div><div class="st" id="t2">사진</div></div><div class="line"></div><div class="step"><div class="circle" id="c3">3</div><div class="st" id="t3">완성</div></div></div><div class="section"><span class="label">THEME</span><span class="tag">🔥 BEST</span></div><div class="themes" id="themes"><div class="theme moon selected" data-theme="moon" data-bg="#0d1b3e" data-foot="#f5c842"><div class="visual"><i></i><i></i><i></i><i></i><b class="check">✓</b></div><div class="info"><div class="name" style="color:#e8c85a">달빛 보름</div><div class="sub">밤하늘 · 금빛 달</div></div></div><div class="theme gold" data-theme="gold" data-bg="#f5e6c0" data-foot="#9a6529"><div class="visual"><i></i><i></i><i></i><i></i><b class="check">✓</b></div><div class="info"><div class="name">황금 들녘</div><div class="sub">풍요 · 황금빛</div></div></div><div class="theme maple" data-theme="maple" data-bg="#3d1a0a" data-foot="#f5a623"><div class="visual"><i></i><i></i><i></i><i></i><b class="check">✓</b></div><div class="info"><div class="name" style="color:#9a4b20">단풍 노을</div><div class="sub">가을 단풍 · 노을빛</div></div></div><div class="theme hanbok" data-theme="hanbok" data-bg="#e8f0ec" data-foot="#557b62"><div class="visual"><i></i><i></i><i></i><i></i><b class="check">✓</b></div><div class="info"><div class="name">한복 크림</div><div class="sub">전통 옥색 · 우아함</div></div></div></div><div class="more" id="pills"><button class="pill" data-bg="#f7f4ef" data-foot="#9a8878">달항아리</button><button class="pill" data-bg="#2a1a2e" data-foot="#d4a843">차례상</button><button class="pill" data-bg="#c8a882" data-foot="#5a3a1a">가을 산책</button></div><div class="section"><span class="label">PHOTOS</span><span class="tag green" id="count">0 / 4 선택됨</span></div><div class="slots" id="slots"></div><div class="section"><span class="label">PREVIEW</span><span class="label" style="color:#bbb;letter-spacing:0">레이아웃 변경</span></div><div class="preview"><div class="strip" id="previewStrip"><div class="ps" id="p0"></div><div class="ps" id="p1"></div><div class="ps" id="p2"></div><div class="ps" id="p3"></div><div class="foot brand-foot" id="pfoot"><div class="brand-main">명도복지관</div><div class="brand-stars"><span>✦</span><span>✦</span></div><div class="brand-sub">주간보호센터</div></div></div><div class="layouts"><button class="layout active" data-layout="col">▤</button><button class="layout" data-layout="grid">⊞</button></div></div><div class="btnarea"><button class="primary" id="go" disabled>✨ 취합된 사진 보기</button></div></div><div class="screen" id="save"><div class="savehero"><div style="font-size:42px">✦</div><b>나만의 네컷 완성!</b><p>선택한 사진과 테마를 한눈에 확인하세요</p></div><div class="resultbox"><div class="resultstrip" id="resultStrip"><div class="rs" id="r0"></div><div class="rs" id="r1"></div><div class="rs" id="r2"></div><div class="rs" id="r3"></div><div class="foot brand-foot" id="rfoot"><div class="brand-main">명도복지관</div><div class="brand-stars"><span>✦</span><span>✦</span></div><div class="brand-sub">주간보호센터</div></div></div></div><div class="actions"><div class="action">📸<br><br>사진 4장 취합 완료</div><div class="action">🎨<br><br>선택 테마 적용</div></div><button class="savebtn" id="downloadBtn">💾 이미지로 저장하기</button><div class="btnarea"><button class="primary" id="back">← 사진 다시 선택하기</button></div></div><input type="file" id="file" accept="image/*" hidden></div><script>
const photos=[null,null,null,null];let active=0,layout='col',theme={bg:'#0d1b3e',foot:'#f5c842'};const slots=document.getElementById('slots');for(let i=0;i<4;i++){const d=document.createElement('div');d.className='slot';d.innerHTML='<span>＋</span><small>'+ (i+1) +'</small>';d.onclick=()=>{active=i;document.getElementById('file').click()};slots.appendChild(d)}
function render(){photos.forEach((u,i)=>{for(const id of ['p','r']){const e=document.getElementById(id+i);e.innerHTML=u?'<img src="'+u+'">':''}const s=slots.children[i];if(u){s.innerHTML='<img src="'+u+'"><b class="done">✓</b>'} });const n=photos.filter(Boolean).length;count.textContent=n+' / 4 선택됨';go.disabled=n<4;document.getElementById('c2').className='circle '+(n?'on':'');document.getElementById('t2').className='st '+(n?'on':'');applyTheme();}
function applyTheme(){for(const id of ['previewStrip','resultStrip']){const e=document.getElementById(id);e.style.background=theme.bg}for(const id of ['pfoot','rfoot'])document.getElementById(id).style.color=theme.foot}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{photos[active]=x.target.result;render()};r.readAsDataURL(f);e.target.value=''};
document.querySelectorAll('.theme').forEach(x=>x.onclick=()=>{document.querySelectorAll('.theme,.pill').forEach(a=>a.classList.remove('selected'));x.classList.add('selected');theme={bg:x.dataset.bg,foot:x.dataset.foot};applyTheme()});document.querySelectorAll('.pill').forEach(x=>x.onclick=()=>{document.querySelectorAll('.theme,.pill').forEach(a=>a.classList.remove('selected'));x.classList.add('selected');theme={bg:x.dataset.bg,foot:x.dataset.foot};applyTheme()});document.querySelectorAll('.layout').forEach(x=>x.onclick=()=>{layout=x.dataset.layout;document.querySelectorAll('.layout').forEach(a=>a.classList.remove('active'));x.classList.add('active');document.getElementById('previewStrip').classList.toggle('grid',layout==='grid')});go.onclick=()=>{document.getElementById('resultStrip').classList.toggle('grid',layout==='grid');document.getElementById('main').classList.remove('active');document.getElementById('save').classList.add('active');document.getElementById('c3').className='circle done'};back.onclick=()=>{document.getElementById('save').classList.remove('active');document.getElementById('main').classList.add('active')};

document.getElementById('downloadBtn').onclick=()=>{
  const size=1080, pad=60, gap=20, footer=110;
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  let cols=layout==='grid'?2:1, rows=layout==='grid'?2:4;
  const photoSize=layout==='grid'?(size-pad*2-gap)/2:(size-pad*2);
  const width=size, height=pad*2+rows*photoSize+(rows-1)*gap+footer;
  canvas.width=width; canvas.height=height;
  ctx.fillStyle=theme.bg; ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#ffffff';
  photos.forEach((src,i)=>{
    const img=new Image(); img.src=src;
    img.onload=()=>{
      const col=layout==='grid'?i%2:0, row=layout==='grid'?Math.floor(i/2):i;
      const x=pad+col*(photoSize+gap), y=pad+row*(photoSize+gap);
      const scale=Math.max(photoSize/img.naturalWidth,photoSize/img.naturalHeight);
      const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
      ctx.drawImage(img,x+(photoSize-w)/2,y+(photoSize-h)/2,w,h);
      if(i===3){
        ctx.fillStyle=theme.foot; ctx.font='italic 42px Georgia, serif';ctx.textAlign='center';
        ctx.fillStyle=theme.foot; ctx.font='500 42px Malgun Gothic, Arial, sans-serif';ctx.fillText('명도복지관',width/2,height-78);ctx.font='italic 28px Georgia, serif';ctx.fillText('✦',width/2-190,height-50);ctx.fillText('✦',width/2+190,height-50);ctx.font='500 30px Malgun Gothic, Arial, sans-serif';ctx.fillText('주간보호센터',width/2,height-24);
        const a=document.createElement('a');a.download='인생네컷_'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();
      }
    };
  });
};render();
</script></body></html>
